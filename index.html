
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CookieLab recuerda tus preferencias entre visitas.">
    <title>CookieLab</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="contenedor">
      <header class="encabezado">
        <p class="marca">CookieLab</p>
        <h1>Tu rincón, tus preferencias</h1>
        <p id="saludo"></p>
        <p id="contador-visitas"></p>
      </header>
      <section class="tarjeta preferencias" aria-labelledby="titulo-preferencias">
        <h2 id="titulo-preferencias">Tus preferencias</h2>
        <div class="campos">
          <label for="tema">Tema</label>
          <select id="tema" name="tema">
            <option value="claro">Claro</option>
            <option value="oscuro">Oscuro</option>
          </select>
          <label for="idioma">Idioma del saludo</label>
          <select id="idioma" name="idioma">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </div>
      </section>
      <section class="tarjeta" aria-labelledby="titulo-visita">
        <h2 id="titulo-visita">Tu actividad</h2>
        <p id="ultima-visita"></p>
        <button id="crear-cookie-prueba" type="button">Crear cookie de prueba (1 min)</button>
        <p id="estado-caducidad" role="status" aria-live="polite"></p>
      </section>
      <section class="tarjeta" aria-labelledby="titulo-control">
        <h2 id="titulo-control">Panel de control</h2>
        <div class="acciones">
          <button id="cambiar-nombre" type="button">Cambiar mi nombre</button>
          <button id="olvidarme" type="button">Olvidarme</button>
        </div>
        <p id="estado-cuenta" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
